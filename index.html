<script>

let perguntaAtual = 0;
let tentativas = 0;

const perguntas = [

    "Você costuma tomar decisões por impulso?",

    "Você costuma se meter em situações que sabe que podem dar problema?",

    "Você considera que curiosidade é uma justificativa válida para continuar?"

];


function proximaPergunta() {

    if (perguntaAtual < perguntas.length) {

        document.getElementById("terminal").innerHTML = `

            <div class="status">
                ANALISANDO COMPORTAMENTO...
            </div>

            <h1>PERGUNTA ${perguntaAtual + 1}/3</h1>

            <div class="pergunta">
                ${perguntas[perguntaAtual]}
            </div>

            <button onclick="responder()">
                SIM
            </button>

            <button onclick="responder()">
                NÃO
            </button>

        `;

        perguntaAtual++;

    } else {

        perguntaFinal();

    }

}


function responder() {

    const terminal = document.getElementById("terminal");

    terminal.innerHTML = `

        <div class="status">
            PROCESSANDO RESPOSTA...
        </div>

        <h1>ANÁLISE EM ANDAMENTO</h1>

        <p>
            Resposta registrada.
        </p>

        <p>
            Analisando padrão de comportamento...
        </p>

    `;

    setTimeout(() => {

        if (perguntaAtual === perguntas.length) {

            terminal.innerHTML += `

                <p>
                    Resultado: inconclusivo.
                </p>

                <p>
                    Uma última pergunta será necessária.
                </p>

                <button onclick="perguntaFinal()">
                    CONTINUAR
                </button>

            `;

        } else {

            proximaPergunta();

        }

    }, 1200);

}


function perguntaFinal() {

    document.getElementById("terminal").innerHTML = `

        <div class="status">
            ANÁLISE FINAL
        </div>

        <h1>UMA ÚLTIMA PERGUNTA</h1>

        <div class="pergunta">

            Você costuma fugir quando
            uma situação fica interessante?

        </div>

        <button onclick="finalSim()">
            SIM
        </button>

        <button id="naoFinal">
            NÃO
        </button>

    `;

    const botaoNao = document.getElementById("naoFinal");

    botaoNao.addEventListener("pointerenter", fugir);
    botaoNao.addEventListener("pointerdown", fugir);

}


function fugir(event) {

    if (event) {
        event.preventDefault();
    }

    tentativas++;

    const botao = document.getElementById("naoFinal");

    const largura = window.innerWidth - botao.offsetWidth - 20;
    const altura = window.innerHeight - botao.offsetHeight - 20;

    const x = Math.max(10, Math.random() * largura);
    const y = Math.max(10, Math.random() * altura);

    botao.style.position = "fixed";
    botao.style.left = x + "px";
    botao.style.top = y + "px";


    const mensagens = [

        "Resposta recusada.",

        "O sistema detectou hesitação.",

        "Luís.",

        "Isso está ficando constrangedor.",

        "Você pode parar de tentar.",

        "O botão já tomou uma decisão por você."

    ];


    const terminal = document.getElementById("terminal");

    let mensagem = mensagens[
        Math.min(tentativas - 1, mensagens.length - 1)
    ];


    let aviso = document.getElementById("avisoFuga");

    if (!aviso) {

        aviso = document.createElement("div");

        aviso.id = "avisoFuga";
        aviso.className = "erro";

        terminal.appendChild(aviso);

    }

    aviso.textContent = mensagem;

}


function finalSim() {

    document.getElementById("terminal").innerHTML = `

        <div class="status">
            DIAGNÓSTICO CONCLUÍDO
        </div>

        <h1>RESULTADO</h1>

        <div class="final">

            Interessante.

            <br><br>

            Nao sou a unica escolhendo o caminho mais difícil.

        </div>

        <div class="erro">
            SISTEMA ENCERRADO.
        </div>

    `;

}

</script>
