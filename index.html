<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Diagnóstico do Usuário</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: #00ff88;
            font-family: monospace;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        .terminal {
            width: 90%;
            max-width: 650px;
            text-align: center;
        }

        .status {
            font-size: 13px;
            opacity: 0.6;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 30px;
        }

        p {
            font-size: 17px;
            line-height: 1.6;
        }

        .pergunta {
            font-size: 20px;
            line-height: 1.5;
            margin: 30px 0;
        }

        button {
            background: transparent;
            color: #00ff88;

            border: 1px solid #00ff88;
            border-radius: 5px;

            padding: 12px 25px;
            margin: 8px;

            font-family: monospace;
            font-size: 16px;

            cursor: pointer;

            transition: 0.15s;
        }

        button:hover {
            background: #00ff88;
            color: #111;
        }

        .resultado {
            margin-top: 30px;
            min-height: 30px;
        }

        .final {
            font-size: 19px;
            line-height: 1.8;
        }

        .erro {
            margin-top: 30px;
            font-size: 14px;
            opacity: 0.65;
        }

        #naoFinal {
            position: relative;
        }

    </style>

</head>


<body>

    <div class="terminal" id="terminal">

        <div class="status">
            SISTEMA DE DIAGNÓSTICO v1.0
        </div>

        <h1>INICIANDO ANÁLISE...</h1>

        <p>
            Um breve diagnóstico será realizado.
            <br>
            Algumas respostas serão necessárias.
        </p>

        <div class="pergunta">
            Você está disposto a continuar?
        </div>

        <button onclick="iniciarDiagnostico()">
            SIM
        </button>

        <button onclick="iniciarDiagnostico()">
            NÃO
        </button>

    </div>


    <script>

        let perguntaAtual = 0;
        let tentativas = 0;

        const perguntas = [

            "Você você se considera uma pessoa inteligente?",
            "Você costuma tomar decisões por impulso?",

            "Quando existe um caminho fácil e um caminho difícil, você costuma escolher o difícil?",

            "Você considera curiosidade uma justificativa válida para continuar?"

        ];


        function iniciarDiagnostico() {

            perguntaAtual = 0;

            mostrarPergunta();

        }


        function mostrarPergunta() {

            const terminal = document.getElementById("terminal");

            terminal.innerHTML = `

                <div class="status">
                    ANALISANDO COMPORTAMENTO...
                </div>

                <h1>PERGUNTA ${perguntaAtual + 1}/${perguntas.length}</h1>

                <div class="pergunta">
                    ${perguntas[perguntaAtual]}
                </div>

                <button onclick="responder()">
                    SIM
                </button>

                <button onclick="responder()">
                    NÃO
                </button>

            `;

        }


        function responder() {

            const terminal = document.getElementById("terminal");

            terminal.innerHTML = `

                <div class="status">
                    PROCESSANDO RESPOSTA...
                </div>

                <h1>ANÁLISE EM ANDAMENTO</h1>

                <p>
                    Resposta registrada.
                </p>

                <p>
                    Analisando padrão de comportamento...
                </p>

            `;

            setTimeout(() => {

                perguntaAtual++;

                if (perguntaAtual < perguntas.length) {

                    mostrarPergunta();

                } else {

                    mostrarAnaliseFinal();

                }

            }, 1000);

        }


        function mostrarAnaliseFinal() {

            const terminal = document.getElementById("terminal");

            terminal.innerHTML = `

                <div class="status">
                    ANÁLISE CONCLUÍDA
                </div>

                <h1>RESULTADO INCONCLUSIVO</h1>

                <p>
                    O sistema identificou um padrão
                    de comportamento curioso.
                </p>

                <p>
                    Uma última verificação será necessária.
                </p>

                <button onclick="perguntaFinal()">
                    CONTINUAR
                </button>

            `;

        }


        function perguntaFinal() {

            const terminal = document.getElementById("terminal");

            terminal.innerHTML = `

                <div class="status">
                    ÚLTIMA VERIFICAÇÃO
                </div>

                <h1>PERGUNTA FINAL</h1>

                <div class="pergunta">

                    Você costuma fugir quando
                    uma situação fica interessante?

                </div>

                <button onclick="diagnosticoDetectado()">
                    SIM
                </button>

                <button id="naoFinal">
                    NÃO
                </button>

            `;

            const botaoNao = document.getElementById("naoFinal");

            botaoNao.addEventListener("pointerenter", fugir);
            botaoNao.addEventListener("pointerdown", fugir);

        }


        function fugir(event) {

            event.preventDefault();

            tentativas++;

            const botao = document.getElementById("naoFinal");

            const largura =
                window.innerWidth - botao.offsetWidth - 20;

            const altura =
                window.innerHeight - botao.offsetHeight - 20;

            const x =
                Math.max(10, Math.random() * largura);

            const y =
                Math.max(10, Math.random() * altura);

            botao.style.position = "fixed";
            botao.style.left = x + "px";
            botao.style.top = y + "px";


            const mensagens = [

                "Resposta recusada.",

                "O sistema detectou hesitação.",

                "Tentativa registrada.",

                "Interessante escolha.",

                "Por que esta sendo teimoso?",

                "Isso está ficando suspeito."

            ];


            let aviso =
                document.getElementById("aviso");

            if (!aviso) {

                aviso = document.createElement("div");

                aviso.id = "aviso";
                aviso.className = "erro";

                document.getElementById("terminal")
                    .appendChild(aviso);

            }


            aviso.textContent =
                mensagens[
                    Math.min(
                        tentativas - 1,
                        mensagens.length - 1
                    )
                ];

        }


        function diagnosticoDetectado() {

    const terminal = document.getElementById("terminal");

    terminal.innerHTML = `

        <div class="status">
            PROCESSAMENTO CONCLUÍDO
        </div>

        <h1>DIAGNÓSTICO DETECTADO</h1>

        <div class="final">

            Parabéns!

        </div>

    `;


    setTimeout(() => {

        terminal.innerHTML = `

            <div class="status">
                PROCESSAMENTO CONCLUÍDO
            </div>

            <h1>DIAGNÓSTICO DETECTADO</h1>

            <div class="final">

                Você 🫵🏻 é curioso!

                <br><br>

                E acaba de perder preciosos minutos
                do seu trabalho.

            </div>

            <div class="erro">

                SISTEMA ENCERRADO.

            </div>

        `;

    }, 2000);

        }
